name: kestrel

services:
  kestrel:
    # `docker compose up -d` pulls the signed release; `--build` builds this
    # checkout and tags it with the same name. Override KESTREL_IMAGE to pin
    # another tag or digest.
    image: ${KESTREL_IMAGE:-ghcr.io/rakuen-ly/kestrel:0.2.0}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:7331:7331"
    environment:
      KESTREL_TOKEN: ${KESTREL_TOKEN:?set KESTREL_TOKEN in .env}
      KESTREL_MODEL: ${KESTREL_MODEL:-gpt-4o-mini}
      KESTREL_PLUGINS: plugins,examples/plugins
      KESTREL_WORKSPACE: /workspace
      KESTREL_DATA_DIR: /data
    env_file:
      - path: .env
        required: false
    volumes:
      - ./workspace:/workspace
      - kestrel-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7331/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  kestrel-data:
