apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kestrel-data
  namespace: kestrel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kestrel-workspace
  namespace: kestrel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
