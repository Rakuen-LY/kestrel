# Example only — do not commit real credentials.
# Prefer: kubectl -n kestrel create secret generic kestrel-secrets \
#   --from-literal=KESTREL_TOKEN="$(openssl rand -hex 24)" \
#   --from-literal=OPENAI_API_KEY="sk-..."
apiVersion: v1
kind: Secret
metadata:
  name: kestrel-secrets
  namespace: kestrel
type: Opaque
stringData:
  KESTREL_TOKEN: replace-with-a-long-random-token
  OPENAI_API_KEY: replace-with-a-provider-key
