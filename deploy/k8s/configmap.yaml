apiVersion: v1
kind: ConfigMap
metadata:
  name: kestrel-config
  namespace: kestrel
  labels:
    app.kubernetes.io/name: kestrel
data:
  kestrel.config.json: |
    {
      "name": "Kestrel",
      "server": {
        "host": "0.0.0.0",
        "port": 7331
      },
      "model": {
        "default": "gpt-4o-mini",
        "maxSteps": 60,
        "temperature": 0.2
      },
      "agent": {
        "workspace": "/workspace"
      },
      "plugins": {
        "directories": ["plugins", "examples/plugins"],
        "config": {
          "@kestrel/plugin-tools-core": {
            "restrictToWorkspace": true,
            "shellPermission": "ask",
            "webPermission": "ask"
          }
        }
      },
      "storage": {
        "directory": "/data"
      }
    }
