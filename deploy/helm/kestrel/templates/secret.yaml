{{- if .Values.secret.create }}
{{- if not .Values.secret.token }}
{{- fail "secret.token is required when secret.create is true (or set secret.existingSecret and leave create false)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel.secretName" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
type: Opaque
stringData:
  KESTREL_TOKEN: {{ .Values.secret.token | quote }}
  {{- with .Values.secret.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
